name: Build Kernel G532G

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            gcc-aarch64-linux-gnu \
            git \
            wget \
            xz-utils \
            liblz4-tool \
            libzstd-dev

      - name: Setup environment variables
        run: |
          echo "ARCH=arm64" >> \$GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> \$GITHUB_ENV

      - name: Generate defconfig (если grandppltedx_defconfig нет)
        run: |
          # Пытаемся найти любой defconfig, начинающийся на grandpplte
          ls arch/arm64/configs/ | grep grandpplte || true
          # Если не нашли, пробуем стандартный generic
          if [ ! -f arch/arm64/configs/grandppltedx_defconfig ]; then
            echo "Defconfig grandppltedx_defconfig not found. Trying to find alternative..."
            # Для MT6737 часто используют generic_arm64_defconfig + overlay
            cp arch/arm64/configs/generic_arm64_defconfig .config
          else
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- grandppltedx_defconfig
          fi

      - name: Build kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j\$(nproc) Image.gz dtbs 2>&1 | tee build.log

      - name: Check build artifacts
        run: |
          ls -lh arch/arm64/boot/
          ls -lh arch/arm64/boot/dts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-g532g
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/**/*.dtb
            build.log

