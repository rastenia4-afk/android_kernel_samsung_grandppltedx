name: Build Kernel G532G

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            gcc-aarch64-linux-gnu \
            git \
            wget \
            xz-utils \
            liblz4-tool \
            libzstd-dev \
            libelf-dev

      - name: Find available defconfigs
        id: find-defconfig
        run: |
          cd arch/arm64/configs
          echo "Available defconfigs:"
          ls -1 *.defconfig
          # Ищем подходящий конфиг для G532G/grandpplte
          for cfg in grandppltedx_defconfig grandpplte_defconfig sm_g532g_defconfig generic_arm64_defconfig; do
            if [ -f "\$cfg" ]; then
              echo "FOUND_CONFIG=$cfg" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "FOUND_CONFIG=generic_arm64_defconfig" >> \$GITHUB_OUTPUT

      - name: Setup environment variables
        run: |
          echo "ARCH=arm64" >> \$GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> \$GITHUB_ENV
          echo "KBUILD_BUILD_USER=github-actions" >> \$GITHUB_ENV
          echo "KBUILD_BUILD_HOST=github" >> \$GITHUB_ENV

      - name: Generate defconfig
        run: |
          cfg=\${{ steps.find-defconfig.outputs.FOUND_CONFIG }}
          echo "Using defconfig: \$cfg"
          if [ "\$cfg" = "generic_arm64_defconfig" ]; then
            # Для generic нужно дополнительно включить нужные опции вручную или через .config
            cp arch/arm64/configs/\$cfg .config
            # Здесь можно добавить ручные включения через scripts/config, если нужно
          else
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- "\$cfg"
          fi

      - name: Build kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j\$(nproc) Image.gz dtbs 2>&1 | tee build.log

      - name: Check build artifacts
        run: |
          ls -lh arch/arm64/boot/
          ls -lh arch/arm64/boot/dts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-g532g
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/**/*.dtb
            build.log

